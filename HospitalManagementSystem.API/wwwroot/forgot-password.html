<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forgot Password — MediCare HMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <style>
    :root { --brand-dark: #0d3b66; --brand-light: #1a6ea8; }
    body {
      background: linear-gradient(135deg, var(--brand-dark) 0%, var(--brand-light) 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
    }
    .card-box {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
    }
    .logo-circle {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, var(--brand-dark), var(--brand-light));
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px;
    }
    .logo-circle i { font-size: 32px; color: #fff; }
    h2 { color: var(--brand-dark); font-weight: 700; }
    .subtitle { color: #6c757d; font-size: 0.9rem; }
    .form-label { color: var(--brand-dark); font-weight: 500; }
    .form-control:focus { border-color: var(--brand-light); box-shadow: 0 0 0 0.2rem rgba(26,110,168,0.25); }
    .btn-brand {
      background: linear-gradient(135deg, var(--brand-dark), var(--brand-light));
      border: none; color: #fff; font-weight: 600; padding: 12px;
    }
    .btn-brand:hover { opacity: 0.9; color: #fff; }
    #resultMsg { display: none; }
  </style>
</head>
<body>
  <div class="card-box">
    <div class="logo-circle"><i class="bi bi-key"></i></div>
    <h2 class="text-center mb-1">Forgot Password</h2>
    <p class="subtitle text-center mb-4">Enter your username and we'll email you a reset link, if an account with that username has an email on file.</p>

    <div class="alert" id="resultMsg" role="alert"></div>

    <form id="forgotForm">
      <div class="mb-4">
        <label class="form-label">Username</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input type="text" class="form-control" id="username" placeholder="Enter your username" required/>
        </div>
      </div>
      <button type="submit" class="btn btn-brand w-100">
        <span id="btnText"><i class="bi bi-send me-2"></i>Send Reset Link</span>
        <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
      </button>
    </form>

    <p class="text-center mt-4 mb-0">
      <a href="index.html" style="font-size:0.9rem;"><i class="bi bi-arrow-left me-1"></i>Back to login</a>
    </p>
  </div>

  <script>
    const API = window.location.hostname === 'localhost' ? 'https://localhost:56075/api' : `${window.location.origin}/api`;

    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnText');
      const spinner = document.getElementById('btnSpinner');
      const resultMsg = document.getElementById('resultMsg');
      const form = document.getElementById('forgotForm');

      btn.classList.add('d-none');
      spinner.classList.remove('d-none');
      resultMsg.style.display = 'none';

      try {
        const res = await fetch(`${API}/auth/forgot-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: document.getElementById('username').value })
        });
        const data = await res.json().catch(() => ({}));

        resultMsg.className = 'alert alert-success';
        resultMsg.innerHTML = `<i class="bi bi-check-circle-fill me-2"></i>${data.message || 'If that account exists, a reset link has been sent.'}`;
        resultMsg.style.display = 'block';
        form.style.display = 'none';
      } catch {
        resultMsg.className = 'alert alert-danger';
        resultMsg.innerHTML = `<i class="bi bi-exclamation-triangle-fill me-2"></i>Cannot connect to server. Make sure the API is running.`;
        resultMsg.style.display = 'block';
      } finally {
        btn.classList.remove('d-none');
        spinner.classList.add('d-none');
      }
    });
  </script>
</body>
</html>
